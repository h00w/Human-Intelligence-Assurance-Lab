name: Long-Window Qualification

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'hia/drift.py'
      - 'hia/authoritative.py'
      - 'scripts/run_long_window_qualification.py'
      - 'scripts/generate_v1_readiness_manifest.py'
      - '.github/workflows/long-window-qualification.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HIA_ADAPTIVE_MODEL: meta-llama/Llama-3.1-8B-Instruct
      HIA_ADAPTIVE_PRIMARY: nscale
      HIA_ADAPTIVE_FALLBACK: novita
      HIA_ADAPTIVE_TRIALS: '5'
      HIA_ADAPTIVE_FAULT_TRIALS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Run fresh adaptive qualification
        if: github.event_name != 'push'
        run: python scripts/run_adaptive_hedging.py
      - name: Archive time-separated evidence
        id: archive
        continue-on-error: true
        run: python scripts/run_long_window_qualification.py
      - name: Refresh Phase 1 v1 readiness manifest
        run: python scripts/generate_v1_readiness_manifest.py
      - name: Upload long-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: hia-long-window-qualification
          path: |
            artifacts/long_window_report.json
            artifacts/phase_1_v1_readiness.json
          retention-days: 30
      - name: Enforce long-window verdict
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('artifacts/long_window_report.json').read_text())['status']
          print(f'long-window status: {status}')
          raise SystemExit(2 if status == 'HOLD' else 0)
          PY
