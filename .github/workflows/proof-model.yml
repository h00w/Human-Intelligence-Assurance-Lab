name: Production AI Proof Model

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Assess five-level proof
        run: make proof
      - name: Upload proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ai-proof
          path: evidence/out/current/
