[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-intelligence-assurance-lab"
version = "0.1.0"
description = "Evaluation and release assurance for emotionally aware, human-centered AI"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "pandas>=2.2,<3",
  "streamlit>=1.37,<2",
  "huggingface_hub>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
